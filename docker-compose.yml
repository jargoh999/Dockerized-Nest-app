version: '3.8'
services:
  nestjs-app:
    image: jargoh999/nest_crud_app:latest
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_NAME=nest_crud

  postgres:
    image: postgres:13-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nest_crud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    tmpfs:
      - /var/lib/postgresql/data/pg_stat_tmp:mode=755,uid=999,gid=999

volumes:
  postgres-data:
