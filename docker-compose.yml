version: '3.8'
services:
  nestjs-app:
    image: jargoh999/nest_crud_app:latest
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - POSTGRES_USER=nest_db
      - POSTGRES_PASSWORD=password
      - POSTGRES_NAME=nest_crud

  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: nest_db
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nest_crud
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U nest_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
